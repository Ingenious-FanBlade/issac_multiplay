[package]
name = "isaac-cs-harness"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "harness"
path = "src/main.rs"

[[bin]]
name = "isaac-dual"
path = "src/bin/isaac_dual.rs"

[[bin]]
name = "isaac-input"
path = "src/bin/isaac_input.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# 独立wire对照必须精确恢复十进制f64，不以容差掩盖正文最后一位差异。
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[profile.release]
panic = "unwind"
