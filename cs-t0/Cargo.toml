[package]
name = "isaac-cs-t0"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[[bin]]
name = "IsaacCsT0"
path = "src/main.rs"

[[bin]]
name = "IsaacCsT0T09"
path = "src/t09_main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.18"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
